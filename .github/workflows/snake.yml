name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk@v3
        with:
          github_user_name: Raven9779
          outputs: |
            output/snake.svg
            output/snake-dark.svg?palette=github-dark
      - name: Commit and push generated snake files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/snake.svg output/snake-dark.svg
          git diff --staged --quiet || git commit -m "chore: update snake animation [skip ci]"
          git push
