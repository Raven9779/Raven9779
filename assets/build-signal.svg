<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260" role="img" aria-labelledby="title desc">
  <title id="title">Raven9779 build signal</title>
  <desc id="desc">A build status card showing the personal publishing stack deployed, a custom domain pending, and first writing next.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="58%" stop-color="#123447"/>
      <stop offset="100%" stop-color="#0f3d3e"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset="28%" stop-color="#2dd4bf"/>
      <stop offset="72%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#cbd5e1" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="960" height="260" rx="18" fill="url(#background)"/>
  <rect width="960" height="260" rx="18" fill="url(#grid)"/>
  <rect x="1" y="1" width="958" height="258" rx="17" fill="none" stroke="#67e8f9" stroke-opacity=".24"/>

  <path d="M40 64H920" stroke="url(#line)" stroke-width="1"/>
  <circle cx="43" cy="40" r="5" fill="#2dd4bf" filter="url(#glow)"/>
  <text x="60" y="45" font-family="Courier New, monospace" fill="#f8fafc" font-size="16" font-weight="700">BUILD SIGNAL // 2026.07</text>
  <text x="919" y="45" font-family="Courier New, monospace" text-anchor="end" fill="#94a3b8" font-size="12">BUILDING IN PUBLIC</text>

  <text x="42" y="101" font-family="Courier New, monospace" fill="#94a3b8" font-size="13" font-weight="700">CURRENT FOCUS</text>
  <text x="42" y="128" font-family="Courier New, monospace" fill="#f8fafc" font-size="19" font-weight="700">PERSONAL PUBLISHING STACK</text>
  <text x="42" y="151" font-family="Courier New, monospace" fill="#cbd5e1" font-size="13">Public reading · Authoring workspace · API delivery</text>

  <rect x="652" y="87" width="123" height="28" rx="14" fill="#115e59" stroke="#2dd4bf" stroke-opacity=".72"/>
  <text x="713.5" y="106" font-family="Courier New, monospace" text-anchor="middle" fill="#99f6e4" font-size="11" font-weight="700">DEPLOYED</text>
  <rect x="787" y="87" width="133" height="28" rx="14" fill="#78350f" stroke="#f59e0b" stroke-opacity=".72"/>
  <text x="853.5" y="106" font-family="Courier New, monospace" text-anchor="middle" fill="#fde68a" font-size="11" font-weight="700">DOMAIN PENDING</text>

  <path d="M42 184H918" stroke="#e2e8f0" stroke-opacity=".14"/>
  <circle cx="49" cy="215" r="6" fill="#2dd4bf"/>
  <path d="M67 215H281" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round"/>
  <circle cx="311" cy="215" r="6" fill="#f59e0b"/>
  <path d="M329 215H543" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 6"/>
  <circle cx="573" cy="215" r="6" fill="#94a3b8"/>
  <path d="M591 215H905" stroke="#94a3b8" stroke-opacity=".55" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 7"/>

  <text x="42" y="244" font-family="Courier New, monospace" fill="#94a3b8" font-size="13" font-weight="700">SYSTEM</text>
  <text x="124" y="244" font-family="Courier New, monospace" fill="#cbd5e1" font-size="13">v1 deployed</text>
  <text x="330" y="244" font-family="Courier New, monospace" fill="#94a3b8" font-size="13" font-weight="700">NEXT</text>
  <text x="390" y="244" font-family="Courier New, monospace" fill="#cbd5e1" font-size="13">custom domain</text>
  <text x="620" y="244" font-family="Courier New, monospace" fill="#94a3b8" font-size="13" font-weight="700">THEN</text>
  <text x="680" y="244" font-family="Courier New, monospace" fill="#cbd5e1" font-size="13">first real writing</text>
</svg>
