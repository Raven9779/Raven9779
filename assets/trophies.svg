<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="30%" stop-color="#a78bfa"/>
      <stop offset="70%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="cornerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="bronze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd9b6"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <pattern id="scanlines" patternUnits="userSpaceOnUse" width="400" height="4">
      <rect width="400" height="2" fill="rgba(163, 139, 250, 0.02)"/>
      <rect y="2" width="400" height="2" fill="transparent"/>
    </pattern>
  </defs>

  <!-- Dark background -->
  <rect width="400" height="100" rx="12" ry="12" fill="#0d1117"/>
  <rect x="1" y="1" width="398" height="98" rx="11" ry="11" fill="#1a1a2e"/>

  <!-- Animated border glow -->
  <rect x="1" y="1" width="398" height="98" rx="11" ry="11" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Corner decorations -->
  <rect x="1" y="1" width="16" height="2" rx="1" fill="url(#cornerGrad)" opacity="0.7">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2s" repeatCount="indefinite"/>
  </rect>
  <rect x="1" y="1" width="2" height="16" rx="1" fill="url(#cornerGrad)" opacity="0.7">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2s" repeatCount="indefinite"/>
  </rect>
  <rect x="383" y="1" width="16" height="2" rx="1" fill="url(#cornerGrad)" opacity="0.7">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2s" repeatCount="indefinite"/>
  </rect>
  <rect x="397" y="1" width="2" height="16" rx="1" fill="url(#cornerGrad)" opacity="0.7">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2s" repeatCount="indefinite"/>
  </rect>
  <rect x="1" y="83" width="16" height="2" rx="1" fill="url(#cornerGrad)" opacity="0.7">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2s" repeatCount="indefinite"/>
  </rect>
  <rect x="1" y="84" width="2" height="16" rx="1" fill="url(#cornerGrad)" opacity="0.7">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2s" repeatCount="indefinite"/>
  </rect>
  <rect x="383" y="83" width="16" height="2" rx="1" fill="url(#cornerGrad)" opacity="0.7">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2s" repeatCount="indefinite"/>
  </rect>
  <rect x="397" y="83" width="2" height="16" rx="1" fill="url(#cornerGrad)" opacity="0.7">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2s" repeatCount="indefinite"/>
  </rect>

  <!-- Scanlines overlay -->
  <rect width="400" height="100" fill="url(#scanlines)" opacity="0.3"/>

  <!-- Trophy 1: Gold -->
  <g transform="translate(50, 45)">
    <!-- Trophy cup body -->
    <rect x="-10" y="-8" width="20" height="16" rx="3" fill="url(#gold)" filter="url(#glow)" opacity="0.9">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
    </rect>
    <!-- Trophy handles -->
    <path d="M-14,-2 Q-20,-2 -20,4 Q-20,10 -14,8" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.7"/>
    <path d="M14,-2 Q20,-2 20,4 Q20,10 14,8" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.7"/>
    <!-- Trophy stem -->
    <rect x="-3" y="8" width="6" height="4" rx="1" fill="url(#gold)" opacity="0.8"/>
    <rect x="-5" y="12" width="10" height="3" rx="1.5" fill="url(#gold)" opacity="0.8"/>
    <!-- Star on cup -->
    <polygon points="0,-5 1,-2 4,-2 2,0 3,3 0,1 -3,3 -2,0 -4,-2 -1,-2" fill="#1a1a2e" opacity="0.5" transform="scale(0.6)"/>
    <!-- Label -->
    <text x="0" y="25" font-family="monospace, 'Courier New', Courier" font-size="8" fill="#a8a29e" text-anchor="middle">Gold</text>
  </g>

  <!-- Trophy 2: Silver -->
  <g transform="translate(150, 45)">
    <rect x="-10" y="-8" width="20" height="16" rx="3" fill="url(#silver)" filter="url(#glow)" opacity="0.8">
      <animate attributeName="opacity" values="0.7;0.9;0.7" dur="2.3s" repeatCount="indefinite"/>
    </rect>
    <path d="M-14,-2 Q-20,-2 -20,4 Q-20,10 -14,8" fill="none" stroke="url(#silver)" stroke-width="2" opacity="0.6"/>
    <path d="M14,-2 Q20,-2 20,4 Q20,10 14,8" fill="none" stroke="url(#silver)" stroke-width="2" opacity="0.6"/>
    <rect x="-3" y="8" width="6" height="4" rx="1" fill="url(#silver)" opacity="0.7"/>
    <rect x="-5" y="12" width="10" height="3" rx="1.5" fill="url(#silver)" opacity="0.7"/>
    <!-- Star on cup -->
    <polygon points="0,-5 1,-2 4,-2 2,0 3,3 0,1 -3,3 -2,0 -4,-2 -1,-2" fill="#1a1a2e" opacity="0.4" transform="scale(0.6)"/>
    <text x="0" y="25" font-family="monospace, 'Courier New', Courier" font-size="8" fill="#a8a29e" text-anchor="middle">Silver</text>
  </g>

  <!-- Trophy 3: Bronze -->
  <g transform="translate(250, 45)">
    <rect x="-10" y="-8" width="20" height="16" rx="3" fill="url(#bronze)" filter="url(#glow)" opacity="0.8">
      <animate attributeName="opacity" values="0.7;0.95;0.7" dur="2.5s" repeatCount="indefinite"/>
    </rect>
    <path d="M-14,-2 Q-20,-2 -20,4 Q-20,10 -14,8" fill="none" stroke="url(#bronze)" stroke-width="2" opacity="0.6"/>
    <path d="M14,-2 Q20,-2 20,4 Q20,10 14,8" fill="none" stroke="url(#bronze)" stroke-width="2" opacity="0.6"/>
    <rect x="-3" y="8" width="6" height="4" rx="1" fill="url(#bronze)" opacity="0.7"/>
    <rect x="-5" y="12" width="10" height="3" rx="1.5" fill="url(#bronze)" opacity="0.7"/>
    <!-- Star on cup -->
    <polygon points="0,-5 1,-2 4,-2 2,0 3,3 0,1 -3,3 -2,0 -4,-2 -1,-2" fill="#1a1a2e" opacity="0.4" transform="scale(0.6)"/>
    <text x="0" y="25" font-family="monospace, 'Courier New', Courier" font-size="8" fill="#a8a29e" text-anchor="middle">Bronze</text>
  </g>

  <!-- Trophy 4: Purple (Special) -->
  <g transform="translate(350, 45)">
    <rect x="-10" y="-8" width="20" height="16" rx="3" fill="#6366f1" filter="url(#glow)" opacity="0.8">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="1.8s" repeatCount="indefinite"/>
    </rect>
    <path d="M-14,-2 Q-20,-2 -20,4 Q-20,10 -14,8" fill="none" stroke="#a78bfa" stroke-width="2" opacity="0.6"/>
    <path d="M14,-2 Q20,-2 20,4 Q20,10 14,8" fill="none" stroke="#a78bfa" stroke-width="2" opacity="0.6"/>
    <rect x="-3" y="8" width="6" height="4" rx="1" fill="#a78bfa" opacity="0.7"/>
    <rect x="-5" y="12" width="10" height="3" rx="1.5" fill="#a78bfa" opacity="0.7"/>
    <!-- Star on cup -->
    <polygon points="0,-5 1,-2 4,-2 2,0 3,3 0,1 -3,3 -2,0 -4,-2 -1,-2" fill="#1a1a2e" opacity="0.5" transform="scale(0.6)"/>
    <text x="0" y="25" font-family="monospace, 'Courier New', Courier" font-size="8" fill="#a8a29e" text-anchor="middle">Special</text>
  </g>

  <!-- Decorative dots -->
  <circle cx="12" cy="12" r="1.5" fill="#a78bfa" opacity="0.3">
    <animate attributeName="opacity" values="0.1;0.5;0.1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="388" cy="88" r="1.5" fill="#f59e0b" opacity="0.3">
    <animate attributeName="opacity" values="0.1;0.5;0.1" dur="2.5s" repeatCount="indefinite"/>
  </circle>
</svg>