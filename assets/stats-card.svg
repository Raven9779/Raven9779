<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="400" height="220">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="30%" stop-color="#a78bfa"/>
      <stop offset="70%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="cornerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="barGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <pattern id="scanlines" patternUnits="userSpaceOnUse" width="400" height="4">
      <rect width="400" height="2" fill="rgba(163, 139, 250, 0.02)"/>
      <rect y="2" width="400" height="2" fill="transparent"/>
    </pattern>
  </defs>

  <!-- Dark background -->
  <rect width="400" height="220" rx="12" ry="12" fill="#0d1117"/>
  <rect x="1" y="1" width="398" height="218" rx="11" ry="11" fill="#1a1a2e"/>

  <!-- Animated border glow -->
  <rect x="1" y="1" width="398" height="218" rx="11" ry="11" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Corner decorations -->
  <rect x="1" y="1" width="20" height="2" rx="1" fill="url(#cornerGrad)" opacity="0.7">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2s" repeatCount="indefinite"/>
  </rect>
  <rect x="1" y="1" width="2" height="20" rx="1" fill="url(#cornerGrad)" opacity="0.7">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2s" repeatCount="indefinite"/>
  </rect>
  <rect x="379" y="1" width="20" height="2" rx="1" fill="url(#cornerGrad)" opacity="0.7">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2s" repeatCount="indefinite"/>
  </rect>
  <rect x="397" y="1" width="2" height="20" rx="1" fill="url(#cornerGrad)" opacity="0.7">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2s" repeatCount="indefinite"/>
  </rect>
  <rect x="1" y="199" width="20" height="2" rx="1" fill="url(#cornerGrad)" opacity="0.7">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2s" repeatCount="indefinite"/>
  </rect>
  <rect x="1" y="200" width="2" height="20" rx="1" fill="url(#cornerGrad)" opacity="0.7">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2s" repeatCount="indefinite"/>
  </rect>
  <rect x="379" y="199" width="20" height="2" rx="1" fill="url(#cornerGrad)" opacity="0.7">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2s" repeatCount="indefinite"/>
  </rect>
  <rect x="397" y="199" width="2" height="20" rx="1" fill="url(#cornerGrad)" opacity="0.7">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2s" repeatCount="indefinite"/>
  </rect>

  <!-- Scanlines overlay -->
  <rect width="400" height="220" fill="url(#scanlines)" opacity="0.3"/>

  <!-- Title -->
  <text x="200" y="30" font-family="monospace, 'Courier New', Courier" font-size="12" fill="#f59e0b" text-anchor="middle" letter-spacing="2" opacity="0.7">◈ GITHUB STATS ◈</text>
  <line x1="60" y1="38" x2="340" y2="38" stroke="#6366f1" stroke-width="0.5" opacity="0.3">
    <animate attributeName="opacity" values="0.15;0.4;0.15" dur="3s" repeatCount="indefinite"/>
  </line>

  <!-- Stat: Repos -->
  <g>
    <rect x="25" y="78" width="150" height="4" rx="2" fill="#2a2a3e"/>
    <rect x="25" y="78" width="120" height="4" rx="2" fill="url(#barGrad1)">
      <animate attributeName="width" values="0;120;120" dur="1s" fill="freeze"/>
    </rect>
    <text x="25" y="70" font-family="monospace, 'Courier New', Courier" font-size="11" fill="#a8a29e">Repositories</text>
    <text x="320" y="70" font-family="monospace, 'Courier New', Courier" font-size="12" fill="#a78bfa" text-anchor="end" filter="url(#glow)">24</text>
  </g>

  <!-- Stat: Stars -->
  <g>
    <rect x="25" y="105" width="150" height="4" rx="2" fill="#2a2a3e"/>
    <rect x="25" y="105" width="95" height="4" rx="2" fill="url(#barGrad1)">
      <animate attributeName="width" values="0;95;95" dur="1.2s" fill="freeze"/>
    </rect>
    <text x="25" y="97" font-family="monospace, 'Courier New', Courier" font-size="11" fill="#a8a29e">Stars Earned</text>
    <text x="320" y="97" font-family="monospace, 'Courier New', Courier" font-size="12" fill="#a78bfa" text-anchor="end" filter="url(#glow)">47</text>
  </g>

  <!-- Stat: Commits -->
  <g>
    <rect x="25" y="132" width="150" height="4" rx="2" fill="#2a2a3e"/>
    <rect x="25" y="132" width="140" height="4" rx="2" fill="url(#barGrad2)">
      <animate attributeName="width" values="0;140;140" dur="0.8s" fill="freeze"/>
    </rect>
    <text x="25" y="124" font-family="monospace, 'Courier New', Courier" font-size="11" fill="#a8a29e">Total Commits</text>
    <text x="320" y="124" font-family="monospace, 'Courier New', Courier" font-size="12" fill="#f472b6" text-anchor="end" filter="url(#glow)">891</text>
  </g>

  <!-- Stat: PRs -->
  <g>
    <rect x="25" y="159" width="150" height="4" rx="2" fill="#2a2a3e"/>
    <rect x="25" y="159" width="110" height="4" rx="2" fill="url(#barGrad2)">
      <animate attributeName="width" values="0;110;110" dur="1.1s" fill="freeze"/>
    </rect>
    <text x="25" y="151" font-family="monospace, 'Courier New', Courier" font-size="11" fill="#a8a29e">Pull Requests</text>
    <text x="320" y="151" font-family="monospace, 'Courier New', Courier" font-size="12" fill="#f472b6" text-anchor="end" filter="url(#glow)">64</text>
  </g>

  <!-- Stat: Rank -->
  <g>
    <text x="25" y="182" font-family="monospace, 'Courier New', Courier" font-size="11" fill="#a8a29e">GitHub Rank</text>
    <text x="320" y="182" font-family="monospace, 'Courier New', Courier" font-size="12" fill="#f59e0b" text-anchor="end" filter="url(#glow)">Top 15%</text>
  </g>

  <!-- Decorative dot -->
  <circle cx="18" cy="18" r="1.5" fill="#a78bfa" opacity="0.3">
    <animate attributeName="opacity" values="0.1;0.5;0.1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="382" cy="202" r="1.5" fill="#f59e0b" opacity="0.3">
    <animate attributeName="opacity" values="0.1;0.5;0.1" dur="2.5s" repeatCount="indefinite"/>
  </circle>
</svg>